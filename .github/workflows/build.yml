name: Сборка MoyaII.exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Сборка
        run: python -m PyInstaller --onefile --noconsole --name MoyaII moya_ii.py

      - name: Прикрепить к выпуску
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MoyaII.exe

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MoyaII
          path: dist/MoyaII.exe
